<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С 8 Марта ❤️</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#ffd6e7,#ffeef6);
text-align:center;
overflow-x:hidden;
}

.container{
padding:40px;
}

h1{
color:#d81b60;
font-size:50px;
}

#typing{
font-size:22px;
color:#6b2c4a;
max-width:700px;
margin:auto;
min-height:120px;
}

.gallery{
margin-top:40px;
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap;
}

.gallery img{
width:220px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
object-fit:cover;
}

.main-photo {
  width: 100%;
  aspect-ratio: 1 / 1; /* современное свойство, задаёт соотношение сторон 1:1 */
  object-fit: cover;
}

.gallery img:hover{
transform:scale(1.1);
}

button{
margin-top:30px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:30px;
background:#ff5c9c;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff2e82;
transform:scale(1.05);
}

#secret{
display:none;
font-size:26px;
color:#c2185b;
margin-top:20px;
}

/* лепестки */

.petal{
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container">

<h1>С 8 Марта 💖</h1>

<div id="typing"></div>

<button onclick="playMusic()">💖 Нажми для сюрприза</button>

<div id="secret">
Ты самая прекрасная девушка в моей жизни ❤️
</div>

<div class="gallery">
<img src="photo1.jpg">
<img src="photo2.jpg" class="main-photo">
<img src="photo3.jpg">
</div>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* печатающийся текст */

const text = "Солнце, поздравляю тебя с 8 Марта! 🌸 Желаю тебе крепкого здоровья, счастья и чтобы всегда оставалась такой красивой, доброй и улыбчивой! Ты делаешь мою жизнь счастливее каждый день! Я очень рад, что ты у меня есть❤️";

let i = 0;

function typing(){

if(i < text.length){
document.getElementById("typing").innerHTML += text.charAt(i);
i++;
setTimeout(typing,40);
}

}

/* кнопка сюрприза */

function playMusic(){

document.getElementById("music").play();

document.getElementById("secret").style.display="block";

typing();

}

/* падающие лепестки */

function createPetal(){

const petal=document.createElement("div");

petal.classList.add("petal");

petal.innerHTML="🌸";

petal.style.left=Math.random()*100+"vw";

petal.style.animationDuration=(4+Math.random()*4)+"s";

petal.style.fontSize=(15+Math.random()*25)+"px";

document.body.appendChild(petal);

setTimeout(()=>{
petal.remove();
},8000);

}

setInterval(createPetal,400);

</script>

</body>
</html>
